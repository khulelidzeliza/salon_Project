<header class="site-header">


  <nav class="site-header__nav" [class.is-open]="isMenuOpen">
  </nav>

  <a routerLink="/" class="site-header__logo">
    <h1>
      <span class="site-header__logo-main">Rames</span>
      <span class="site-header__logo-accent">Davarkmevt</span>
    </h1>
    <p class="site-header__tagline">BEAUTY ATELIER</p>
  </a>

  <div class="site-header__actions">
    @if (!isOrganizer()) {

    <button  (click)="askLogin()" class="site-header__icon-btn" routerLink="/favorites" aria-label="Favorites">
      <lucide-icon [img]="HeartIcon" [size]="20"></lucide-icon>
    </button>
    }
    @if (user(); as user) {
    @if (isOrganizer()) {
    <button class="btn btn-primary site-header__add-salon" (click)="showAddSalon = true">
      <lucide-icon [img]="PlusIcon" [size]="16"></lucide-icon>
      Add salon
    </button>
    }

    <button class="site-header__icon-btn" routerLink="/profile" aria-label="Account">
      {{ user.userName }}
    </button>

    <button class="site-header__icon-btn site-header__logout" (click)="askLogout()" aria-label="Log out">
      <lucide-icon [img]="LogOutIcon" [size]="20"></lucide-icon>
    </button>
    } @else {
    <button (click)="askLogin()" class="site-header__icon-btn" aria-label="Sign in">
      <lucide-icon [img]="UserIcon" [size]="20"></lucide-icon>
    </button>
    }

  </div>
</header>

<app-add-salon-modal
  [open]="showAddSalon"
  (closed)="showAddSalon = false"
  (created)="onSalonCreated($event)"
></app-add-salon-modal>

<app-confirm-modal
  [open]="showLogoutConfirm"
  title="Log out?"
  message="Are you sure you want to log out?"
  confirmText="Log out"
  cancelText="Stay"
  (confirmed)="logout()"
  (cancelled)="showLogoutConfirm = false">
</app-confirm-modal>

<app-confirm-modal
  [open]="notloggedin"
  title="not logged in"
  message="u need to log in to add items in favorites"
  confirmText="Sign in"
  cancelText="Cancel"
  (confirmed)="login()"
  (cancelled)="notloggedin = false">
</app-confirm-modal>

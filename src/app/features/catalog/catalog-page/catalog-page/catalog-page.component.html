<section class="hero">
  <div class="hero__media" aria-hidden="true"></div>

  <div class="hero__content">
    <h1 class="hero__title">Find your salon </h1>

    <app-filter-bar
      [resultCount]="(totalCount$ | async) ?? 0"
      (filtersChange)="onFiltersChange($event)">
    </app-filter-bar>
  </div>
</section>

<section class="catalog">
  <header class="catalog__head">
    <h2 class="catalog__title">Trending this week</h2>
    <p class="catalog__count" *ngIf="totalCount$ | async as count">{{ count }} {{ count === 1 ? 'salon' : 'salons' }}</p>
  </header>
  <div class="catalog__grid" *ngIf="(loading$ | async) === false; else loadingTpl">
    <app-salon-card
      *ngFor="let salon of salons$ | async"
      [salon]="salon"
      (toggleFavorite)="onToggleFavorite($event)">
    </app-salon-card>
  </div>

  <ng-template #loadingTpl>
    <div class="catalog__grid">
      <div class="salon-card--skeleton" *ngFor="let i of [1, 2, 3, 4, 5, 6]"></div>
    </div>
  </ng-template>
</section>

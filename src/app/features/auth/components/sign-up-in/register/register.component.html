<form class="form form--grid" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="field">
    <label class="field__label" for="reg-username">Username</label>
    <input
      id="reg-username"
      type="text"
      class="field__input"
      placeholder="camille.aubert"
      formControlName="userName"
      [class.is-invalid]="isInvalid('userName')"
      autocomplete="username"
    />
    @if (isInvalid('userName')) {
      <span class="field__error">Please choose a username.</span>
    }
  </div>

  <div class="field">
    <label class="field__label" for="reg-email">Email</label>
    <input
      id="reg-email"
      type="email"
      class="field__input"
      placeholder="you@example.com"
      formControlName="email"
      [class.is-invalid]="isInvalid('email')"
      autocomplete="email"
    />
    @if (isInvalid('email')) {
      <span class="field__error">Enter a valid email address.</span>
    }
  </div>

  <div class="field">
    <label class="field__label" for="reg-phone">
      Phone <span>&mdash; for booking reminders (optional)</span>
    </label>
    <input
      id="reg-phone"
      type="tel"
      class="field__input"
      placeholder="+1 (555) 000 0000"
      formControlName="phoneNumber"
      autocomplete="tel"
    />
  </div>

  <div class="field">
    <label class="field__label" for="reg-password">Choose a password</label>
    <input
      id="reg-password"
      type="password"
      class="field__input"
      placeholder="••••••••"
      formControlName="password"
      [class.is-invalid]="isInvalid('password')"
      autocomplete="new-password"
    />
    @if (isInvalid('password')) {
      <span class="field__error">Use at least 8 characters.</span>
    }
  </div>

  <div class="field field--full">
    <span class="field__label">I'm here to…</span>
    <div class="role-picker" role="radiogroup" aria-label="Account type">
      <label class="role-option" [class.is-active]="form.value.role === Roles.User">
        <input type="radio" [value]="Roles.User" formControlName="role" />
        <span class="role-option__title">Book appointments</span>
        <span class="role-option__desc">Find salons and reserve your chair.</span>
      </label>

      <label class="role-option" [class.is-active]="form.value.role === Roles.Organizator">
        <input type="radio" [value]="Roles.Organizator" formControlName="role" />
        <span class="role-option__title">Manage a salon</span>
        <span class="role-option__desc">List your services and take bookings.</span>
      </label>
    </div>
  </div>

  <label class="check field--full">
    <input type="checkbox" formControlName="agree" />
    I agree to the treatment &amp; cancellation policy.
  </label>

  <button type="submit" class="submit field--full" [disabled]="loading()">
    {{ loading() ? 'Creating…' : 'Create account' }}
  </button>
</form>

<p class="eyebrow">Account recovery</p>
<h2 class="heading">Reset your password</h2>
<p class="sub">Enter your email and we'll send you a reset link.</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="field">
    <label class="field__label" for="reset-email">Email</label>
    <input
      id="reset-email"
      type="email"
      class="field__input"
      placeholder="you@example.com"
      formControlName="email"
      [class.is-invalid]="isInvalid()"
    />
    @if (isInvalid()) {
      <span class="field__error">Enter a valid email address.</span>
    }
  </div>

  <button type="submit" class="submit">Send reset link</button>
</form>

<p class="footer">
  <button type="button" class="link" (click)="backToLogin.emit()">Back to sign in</button>
</p>

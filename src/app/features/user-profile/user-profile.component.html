<div class="profile">
  <app-user-info></app-user-info>

  <div class="profile__body">
    <aside class="profile__aside">
      <app-user-details></app-user-details>
    </aside>

    <div class="profile__main">
      @if (displayRole() === UserRole.Organizator) {
        <app-user-salons></app-user-salons>
      }
      @if (displayRole() === UserRole.User) {
        <app-user-favorites id="favorites"></app-user-favorites>
        <app-user-reviews></app-user-reviews>
      }
    </div>
  </div>
</div>

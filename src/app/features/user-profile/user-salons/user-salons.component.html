<section class="catalog">
  <header class="catalog__header">
    <div>
      <p class="catalog__eyebrow">Business</p>
      <h1>Your salons</h1>
    </div>
  </header>

  @if (loading$ | async) {
    <div class="catalog__grid">
      @for (i of [1,2,3]; track i) {
        <div class="catalog__skeleton"></div>
      }
    </div>
  } @else {
    @if (salons$ | async; as salons) {
      @if (salons.length) {
        <div class="catalog__grid">
          @for (salon of salons; track salon.id) {
            <app-mysalon-card [salon]="salon"></app-mysalon-card>
          }
        </div>
      } @else {
        <div class="catalog__empty">
          <p>You haven't added a salon yet.</p>
          <button type="button" class="btn btn-primary btn--sm" (click)="openAddSalonModal()">Add your salon</button>
        </div>
      }
    }
  }
</section>


<app-add-salon-modal
  [open]="showAddSalon"
  (closed)="showAddSalon = false"
  (created)="onSalonCreated()">
</app-add-salon-modal>

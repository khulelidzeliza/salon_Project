<ng-container *ngIf="salon$ | async as salon; else loadingTpl">
  <ng-container *ngIf="{ cats: (categories$ | async) ?? [], active: activeCategory$ | async } as vm">
    <app-salon-hero [salon]="salon"></app-salon-hero>

    <app-salon-services
      [categories]="vm.cats"
      [active]="vm.active ?? vm.cats[0]"
      (categorySelected)="onSelectCategory($event)">
    </app-salon-services>

    <app-salon-results
      [category]="vm.active ?? vm.cats[0]"
      [procedures]="(workingResultProcedures$ | async) ?? []">
    </app-salon-results>

    <app-salon-masters
      [category]="vm.active ?? vm.cats[0]"
      [masters]="(masters$ | async) ?? []">
    </app-salon-masters>  

    <app-salon-contact [salon]="salon"></app-salon-contact>

    <app-salon-action-bar [salon]="salon"></app-salon-action-bar>
  </ng-container>
</ng-container>

<ng-template #loadingTpl>
  <div class="loading"></div>
</ng-template>

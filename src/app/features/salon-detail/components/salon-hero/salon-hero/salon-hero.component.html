<section class="salon-hero">

  <!-- Main image / gallery -->
  <div class="salon-hero__gallery">
    @if (pictures.length) {
      <div class="salon-hero__main-wrap">
        <img
          class="salon-hero__main-img"
          [src]="serverUrl + pictures[activeSlide]"
          [alt]="salon.englishName" />

        <!-- Gradient overlay with title info -->
        <div class="salon-hero__overlay">
          <div class="salon-hero__overlay-content">
            <p class="salon-hero__eyebrow">
              {{ salon.location }}
              <span *ngIf="salon.AverageRating && salon.AverageRating > 0">
                &nbsp;·&nbsp; ★ {{ salon.AverageRating }}
              </span>
            </p>
            <h1 class="salon-hero__title">{{ salon.englishName }}</h1>
          </div>
        </div>

        <!-- Prev / Next arrows -->
        <button *ngIf="pictures.length > 1" class="salon-hero__arrow salon-hero__arrow--prev"
          (click)="prevSlide()" aria-label="Previous image">‹</button>
        <button *ngIf="pictures.length > 1" class="salon-hero__arrow salon-hero__arrow--next"
          (click)="nextSlide()" aria-label="Next image">›</button>
      </div>

      <!-- Thumbnail strip -->
      <div class="salon-hero__thumbs" *ngIf="pictures.length > 1">
        <button
          *ngFor="let pic of pictures; let i = index"
          class="salon-hero__thumb"
          [class.is-active]="i === activeSlide"
          (click)="setSlide(i)"
          [attr.aria-label]="'View image ' + (i + 1)">
          <img [src]="serverUrl + pic" [alt]="salon.englishName + ' photo ' + (i + 1)" />
        </button>
      </div>
    } @else {
      <!-- Placeholder -->
      <div class="salon-hero__placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="4" y="4" width="16" height="16" rx="2" />
          <path d="M8 14l3-3 2 2 4-4" />
        </svg>
        <h1 class="salon-hero__title salon-hero__title--dark">{{ salon.englishName }}</h1>
      </div>
    }
  </div>

  <!-- Info bar -->
  <div class="salon-hero__info">
    <div class="salon-hero__info-left">
      <span class="salon-hero__info-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg>
        {{ salon.location }}
      </span>
      <span class="salon-hero__info-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        {{ salon.workingHours }}
      </span>
      <span class="salon-hero__info-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8a19.79 19.79 0 01-3.07-8.68A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92v2z"/></svg>
        {{ salon.phoneNumber }}
      </span>
    </div>
    <div class="salon-hero__info-right">
      <span class="salon-hero__price badge">{{ budgetSigns }}</span>
      <a *ngIf="salon.instagramLink" [href]="salon.instagramLink" target="_blank" rel="noopener" class="salon-hero__social" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a *ngIf="salon.facebookLink" [href]="salon.facebookLink" target="_blank" rel="noopener" class="salon-hero__social" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
      </a>
    </div>
  </div>

</section>

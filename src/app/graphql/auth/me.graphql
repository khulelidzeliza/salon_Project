 
query GetUser {
  me {
    id
    userName
    email
    role
    phoneNumber
    createdAt
    updatedAt
    favorites {
      id
      userId
      salonId
      salon {
        id
        englishName,
  georgianName
        pictures
        location
      }
    }
    salons {
      id
      englishName,
  georgianName
      isFavoritedByCurrentUser
      pictures
    }
    reviews {
      id
      star
      createdAt
      comment
      
    }
  }
}
 